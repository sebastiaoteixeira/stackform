- name: Validate the release
  ansible.builtin.assert:
    that:
      - image_tag is defined
      - image_tag is match('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$')
    fail_msg: "Pass the release image tag: -e image_tag=<tag>"
    quiet: true

- name: Prepare the release environment
  ansible.builtin.import_tasks: environment.yml

- name: Remember the previous release
  ansible.builtin.set_fact:
    previous_tag: "{{ running_env.IMAGE_TAG | default('') }}"

- name: Copy the compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deliver the release images
  ansible.builtin.include_tasks: "deliver/{{ app_delivery }}.yml"

- name: Start the release
  ansible.builtin.include_tasks: release.yml

- name: Prune old releases
  ansible.builtin.include_tasks: retention.yml
