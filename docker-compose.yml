services:
  mongodb:
    image: mongo:8
    container_name: yaml-api-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: yaml_api
    volumes:
      - mongodb_data:/data/db

  minio:
    image: minio/minio
    container_name: yaml-api-minio
    restart: unless-stopped
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  mongodb_data:
  minio_data:
