version: "0.3"

api:
  basePath: /api

imports:
  hooks: { path: ./hooks, package: hooks }

mongo:
  uri: ${MONGO_URI}
  database: ${MONGO_DB}

entities:
  user:
    type: auth
    auth: { identifier: email, via: password }
    fields:
      id: { type: id }
      email: { type: string, required: true, unique: true }
  task:
    fields:
      id: { type: id }
      title: { type: string, required: true }
  note:
    fields:
      id: { type: id }
      body: { type: string, required: true }

repositories:
  users: { entity: user, crud: [create] }
  countable:
    abstract: true
    operations:
      countAll:
        query: { command: countDocuments, filter: {} }
  tasks:
    entity: task
    extends: countable
    operations:
      byTitle:
        query: { command: find, filter: { title: $title } }
      notesByBody:
        query: { command: find, collection: notes, filter: { body: $text } }
      retitle:
        query:
          command: bulkWrite
          requests:
            - updateMany: { filter: { title: $old }, update: { $set: { title: $new } } }
  notes:
    entity: note
    crud: [create]

services:
  users: { repository: users }
  tasks:
    repository: tasks
    operations:
      byTitle: true
      notesByBody: true
      retitle: true
      countAll: true
      echo: { handler: hooks.echo }
  notes: { repository: notes }

controllers:
  users:
    service: users
    base_path: /users
    access: public
  archive:
    service: tasks
    base_path: /archive
    access: "*"
    operations:
      byTitle: { method: GET, path: "/by-title/{title}" }
      notesByBody: false
      retitle: false
      countAll: false
      echo: { method: POST, path: "/echo/{id}" }
  totals:
    routes:
      tasks: { service: countAll-tasks, method: GET, path: /tasks-total }
    operations:
      tasks: { path: /totals/tasks }
  tasks:
    service: tasks
    base_path: /tasks
    access: public
    operations:
      byTitle: { method: GET, path: "/by-title/{title}" }
      notesByBody: { method: GET, path: "/notes/{text}" }
      retitle: { method: POST, path: "/retitle/{old}/{new}" }
      echo: { method: POST, path: "/echo/{id}" }
      countAll: { method: GET, path: /stats }
  notes:
    service: notes
    base_path: /notes
    access: public
