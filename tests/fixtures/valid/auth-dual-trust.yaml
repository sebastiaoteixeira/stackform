version: "0.2"
api:
  basePath: /api
  version: v1
  operations:
    defaults:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true
providers:
  keycloak:
    type: oidc
    trust: idp
    client_id: my-app
    discovery_url: "${OIDC_DISCOVERY_URL:-http://localhost:8080/.well-known/openid-configuration}"
    issuer: "https://kc.example.com/realms/main"
    audiences:
      - "my-app"
mongo:
  uri: mongodb://localhost:27017
  database: testdb
entities:
  user:
    type: auth
    auth:
      identifier: email
      via:
        - provider: password
          identifier: email
        - provider: keycloak
          identifier: email
          claim_mapping:
            email: email
          auto_provision: true
    fields:
      id: { type: id }
      email: { type: string, required: true, unique: true }
      name: { type: string, required: true }
repositories:
  users:
    entity: user
services:
  users:
    repository: users
controllers:
  users:
    service: users
    base_path: /users
    access: "*"
