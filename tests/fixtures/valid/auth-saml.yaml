version: "0.2"
api:
  basePath: /api
  version: v1
  operations:
    defaults:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true
providers:
  corporate:
    type: saml
    idp_metadata_url: "${SAML_IDP_METADATA_URL:-http://localhost:8081/metadata}"
    sp_entity_id: "${SAML_SP_ENTITY_ID:-https://sp.example.com/metadata}"
datastores:
  default:
    type: postgres
    dsn: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@localhost:5432/testdb}
entities:
  organization:
    fields:
      id: { type: id }
      name: { type: string, required: true }
      code: { type: string, required: true, unique: true }
      registry: { type: number }
  user:
    type: auth
    auth:
      via:
        - provider: corporate
          identifier: email
          claim_mapping:
            email: "urn:oid:0.9.2342.19200300.100.1.3"
            name: displayName
          auto_provision: true
          relations:
            organizationId:
              collection: organizations
              match:
                code: "urn:oid:2.5.4.10"
            registeredOrganizationId:
              collection: organizations
              match:
                registry: registryNumber
    fields:
      id: { type: id }
      email: { type: string, required: true, unique: true }
      name: { type: string, required: true }
      organizationId: { type: ref, ref: organizations }
      registeredOrganizationId: { type: ref, ref: organizations }
repositories:
  organizations:
    entity: organization
  users:
    entity: user
services:
  organizations:
    repository: organizations
  users:
    repository: users
controllers:
  organizations:
    service: organizations
    base_path: /organizations
    access: public
  users:
    service: users
    base_path: /users
    access: "*"
