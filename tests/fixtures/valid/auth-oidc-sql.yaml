version: "0.2"
api:
  basePath: /api
  version: v1
  operations:
    defaults:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true
providers:
  keycloak:
    type: oidc
    client_id: my-app
    client_secret: "${KEYCLOAK_CLIENT_SECRET}"
    discovery_url: "${OIDC_DISCOVERY_URL:-http://localhost:8080/.well-known/openid-configuration}"
datastores:
  default:
    type: postgres
    dsn: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@localhost:5432/testdb}
entities:
  user:
    type: auth
    auth:
      identifier: email
      bindings:
        - provider: keycloak
          identifier: email
          claim_mapping:
            email: email
          auto_provision: true
    fields:
      id: { type: id }
      email: { type: string, required: true, unique: true }
      name: { type: string, required: true }
repositories:
  users:
    entity: user
services:
  users:
    repository: users
controllers:
  users:
    service: users
    base_path: /users
    access: "*"
