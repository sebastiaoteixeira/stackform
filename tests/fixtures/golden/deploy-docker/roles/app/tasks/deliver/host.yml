- name: Ship the build contexts
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/"
    dest: "{{ app_dir }}/"
    delete: true
    rsync_opts:
      - "--exclude=/.env"
      - "--exclude=/roles"
      - "--exclude=/group_vars"
      - "--exclude=/playbook.yml"
      - "--exclude=/inventory.yml"
      - "--exclude=/ansible.cfg"
      - "--exclude=/requirements.yml"
