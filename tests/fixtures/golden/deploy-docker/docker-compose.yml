x-backend: &backend
  image: python:3.11-slim
  pull_policy: always
  env_file:
    - .env
  restart: unless-stopped

services:
  app:
    <<: *backend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8080), 2)"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB=${MONGO_DB:-docker_app_db}
      - PORT=${PORT:-8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}




