- name: Deploy my-api-service
  hosts: app
  become: true
  # Hardening (opt-in): encrypt secrets at rest with ansible-vault.
  # Move sensitive .env values into group_vars/all/secrets.yml, then run:
  #   ansible-vault encrypt group_vars/all/secrets.yml
  #   ansible-playbook -i inventory.yml playbook.yml --ask-vault-pass
  # group_vars/all is auto-loaded; see README.md ("Hardening") for the full flow.
  roles:
    - app