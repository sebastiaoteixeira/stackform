version: "0.3"
api: { basePath: /api }
datastores:
  uploads: { type: filesystem, path: ./uploads }
entities:
  user:
    type: auth
    auth: { identifier: email, via: password }
    fields:
      id: { type: id }
      email: { type: string, required: true, unique: true }
  document:
    fields:
      id: { type: id }
      avatar: { type: file }
repositories:
  users: { entity: user }
  documents: { entity: document }
services:
  users: { repository: users }
  documents: { repository: documents }
controllers:
  documents:
    base_path: /documents
    routes:
      get:
        service: documents
        method: GET
        path: "/{documentId}"
        access:
          - given:
              principal: identity:user
              doc: documents
            when: doc.avatar equals principal.sub
