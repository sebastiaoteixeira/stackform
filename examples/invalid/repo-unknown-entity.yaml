version: "0.2"

entities:
  posts:
    fields:
      id: { type: id }
      title: { type: string, required: true }

repositories:
  posts:
    entity: articles  # Entity 'articles' doesn't exist
    crud: [create, list, get]

services:
  posts:
    repository: posts

controllers:
  posts:
    base_path: /posts
    routes:
      list:
        method: GET
        path: ""
        service: posts
        access: public

api:
  basePath: /api

mongo:
  uri: mongodb://localhost:27017
  database: test_db