version: "0.2"

entities:
  posts:
    fields:
      id: { type: id }
      title: { type: string, required: true }

repositories:
  posts:
    entity: posts
    crud:  # Should be array, not dict
      create: true
      list: true
      get: true

services:
  posts:
    repository: posts

controllers:
  posts:
    base_path: /posts
    routes:
      list:
        method: GET
        path: ""
        service: posts
        access: public

api:
  basePath: /api

mongo:
  uri: mongodb://localhost:27017
  database: test_db
