# A name is either a literal environment value or a CI secret.
version: "0.3"

api:
  basePath: /api
  version: v1

deploy:
  name: shop
  runtime: docker
  environments:
    staging:
      env: { SMTP_PASSWORD: changeme }
      secrets: [SMTP_PASSWORD]

entities:
  product:
    fields:
      id: { type: id }
      name: { type: string, required: true }

repositories:
  products:
    entity: product

services:
  products:
    repository: products

controllers:
  products:
    service: products
    base_path: /products
    access: public
