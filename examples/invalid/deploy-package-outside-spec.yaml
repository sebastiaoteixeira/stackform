# Packages are staged from below the spec directory only.
version: "0.3"

api:
  basePath: /api
  version: v1

deploy:
  name: shop
  runtime: docker
  backend:
    packages: [../valid/deploy-extension/extensions]

entities:
  product:
    fields:
      id: { type: id }
      name: { type: string, required: true }

repositories:
  products:
    entity: product

services:
  products:
    repository: products

controllers:
  products:
    service: products
    base_path: /products
    access: public
