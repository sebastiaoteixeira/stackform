# docker.image is a base image and docker.registry where built images go: never both.
version: "0.3"

api:
  basePath: /api
  version: v1

deploy:
  name: shop
  runtime: docker
  docker:
    image: python:3.12-slim
    registry: ghcr.io/example/shop

entities:
  product:
    fields:
      id: { type: id }
      name: { type: string, required: true }

repositories:
  products:
    entity: product

services:
  products:
    repository: products

controllers:
  products:
    service: products
    base_path: /products
    access: public
