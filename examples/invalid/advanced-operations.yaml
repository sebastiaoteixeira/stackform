version: "0.2"

api:
  title: Advanced MongoDB Operations API
  version: "1.0.0"
  base: /api/v1

database:
  type: mongodb
  uri: ${MONGO_URI:-mongodb://localhost:27017/advanced_ops}

entities:
  analytics:
    fields:
      event_name:
        type: string
        required: true
      user_id:
        type: string
        required: true
      timestamp:
        type: string
        required: true
      properties:
        type: object
        required: false
      tags:
        type: array
        required: false

  products:
    fields:
      name:
        type: string
        required: true
      category:
        type: string
        required: true
      price:
        type: number
        required: true
      stock:
        type: number
        required: true
      ratings:
        type: array
        required: false
      metadata:
        type: object
        required: false

  orders:
    fields:
      customer_id:
        type: string
        required: true
      items:
        type: array
        required: true
      total:
        type: number
        required: true
      status:
        type: string
        required: true
      created_at:
        type: string
        required: true

services:
  analytics:
    repository: analytics
  products:
    repository: products
  orders:
    repository: orders

repositories:
  analytics:
    entity: analytics
    crud:
      create: true
      list: true
      get: true
    operations:
      - name: events_by_user
        method: find
        query:
          user_id: "{{user_id}}"
        options:
          sort:
            timestamp: -1
          limit: 100
      - name: count_events
        method: countDocuments
        query:
          event_name: "{{event_name}}"
      - name: recent_events
        method: find
        query:
          timestamp:
            $gte: "{{start_date}}"
        options:
          sort:
            timestamp: -1
      - name: aggregate_by_event
        method: aggregate
        pipeline:
          - $match:
              timestamp:
                $gte: "{{start_date}}"
          - $group:
              _id: "$event_name"
              count:
                $sum: 1
              users:
                $addToSet: "$user_id"
          - $project:
              event_name: "$_id"
              count: 1
              unique_users:
                $size: "$users"
          - $sort:
              count: -1
      - name: user_activity_timeline
        method: aggregate
        pipeline:
          - $match:
              user_id: "{{user_id}}"
          - $sort:
              timestamp: -1
          - $limit: 50
          - $project:
              event_name: 1
              timestamp: 1
              properties: 1

  products:
    entity: products
    crud:
      create: true
      list: true
      get: true
      update: true
      delete: true
    operations:
      - name: by_category
        method: find
        query:
          category: "{{category}}"
        options:
          sort:
            price: 1
      - name: price_range
        method: find
        query:
          price:
            $gte: "{{min_price}}"
            $lte: "{{max_price}}"
      - name: low_stock
        method: find
        query:
          stock:
            $lt: "{{threshold}}"
        options:
          sort:
            stock: 1
      - name: search_by_name
        method: find
        query:
          name:
            $regex: "{{query}}"
            $options: i
      - name: top_rated
        method: aggregate
        pipeline:
          - $match:
              category: "{{category}}"
          - $addFields:
              avg_rating:
                $avg: "$ratings.score"
          - $match:
              avg_rating:
                $gte: 4.0
          - $sort:
              avg_rating: -1
          - $limit: 10
      - name: category_stats
        method: aggregate
        pipeline:
          - $group:
              _id: "$category"
              count:
                $sum: 1
              avg_price:
                $avg: "$price"
              total_stock:
                $sum: "$stock"
          - $sort:
              count: -1
      - name: bulk_update_stock
        method: updateMany
        query:
          category: "{{category}}"
        update:
          $inc:
            stock: "{{increment}}"

  orders:
    entity: orders
    crud:
      create: true
      list: true
      get: true
      update: true
    operations:
      - name: by_customer
        method: find
        query:
          customer_id: "{{customer_id}}"
        options:
          sort:
            created_at: -1
      - name: by_status
        method: find
        query:
          status: "{{status}}"
      - name: recent_orders
        method: find
        query:
          created_at:
            $gte: "{{start_date}}"
        options:
          sort:
            created_at: -1
          limit: 100
      - name: high_value_orders
        method: find
        query:
          total:
            $gte: "{{min_total}}"
        options:
          sort:
            total: -1
      - name: customer_lifetime_value
        method: aggregate
        pipeline:
          - $match:
              customer_id: "{{customer_id}}"
          - $group:
              _id: "$customer_id"
              total_spent:
                $sum: "$total"
              order_count:
                $sum: 1
              avg_order_value:
                $avg: "$total"
      - name: sales_by_date
        method: aggregate
        pipeline:
          - $match:
              created_at:
                $gte: "{{start_date}}"
                $lte: "{{end_date}}"
          - $group:
              _id:
                $dateToString:
                  format: "%Y-%m-%d"
                  date:
                    $dateFromString:
                      dateString: "$created_at"
              revenue:
                $sum: "$total"
              orders:
                $sum: 1
          - $sort:
              _id: 1
      - name: mark_shipped
        method: updateMany
        query:
          status: "processing"
          created_at:
            $lt: "{{cutoff_date}}"
        update:
          $set:
            status: shipped
      - name: delete_old_cancelled
        method: deleteMany
        query:
          status: "cancelled"
          created_at:
            $lt: "{{retention_date}}"

controllers:
  analytics:
    service: analytics
    routes:
      - method: POST
        path: /analytics/events
        operation: create
        access: public
      - method: GET
        path: /analytics/events
        operation: list
        access: public

  products:
    service: products
    routes:
      - method: POST
        path: /products
        operation: create
        access: public
      - method: GET
        path: /products
        operation: list
        access: public
      - method: GET
        path: /products/{id}
        operation: get
        access: public
      - method: PATCH
        path: /products/{id}
        operation: update
        access: public
      - method: DELETE
        path: /products/{id}
        operation: delete
        access: public

  orders:
    service: orders
    routes:
      - method: POST
        path: /orders
        operation: create
        access: public
      - method: GET
        path: /orders
        operation: list
        access: public
      - method: GET
        path: /orders/{id}
        operation: get
        access: public
      - method: PATCH
        path: /orders/{id}
        operation: update
        access: public