# Exactly one process serves HTTP.
version: "0.3"

api:
  basePath: /api
  version: v1

deploy:
  name: shop
  runtime: docker
  backend:
    processes:
      api: { asgi: app:app }
      admin: { asgi: app:app }

entities:
  product:
    fields:
      id: { type: id }
      name: { type: string, required: true }

repositories:
  products:
    entity: product

services:
  products:
    repository: products

controllers:
  products:
    service: products
    base_path: /products
    access: public
