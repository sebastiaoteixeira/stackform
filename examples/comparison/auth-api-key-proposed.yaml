version: "0.2"

api:
  operations:
    defaults: [list, get, create, update, delete]

entities:
  client:
    type: auth
    auth:
      identifier: clientId
      via: [apiKey]
    fields:
      id:
        type: id
      clientId:
        type: string
        required: true
        unique: true
      apiKey:
        type: string
        required: true
      name:
        type: string
        required: true
      active:
        type: boolean
        default: true

# CRUD is implicit. No custom operations needed here.
repositories:
  clients:
    entity: client

# Services: only expose the operations we want.
# replace is available at the repo level but intentionally not exposed.
services:
  list-clients:   { repository: clients, operation: list }
  get-client:     { repository: clients, operation: get }
  create-client:  { repository: clients, operation: create }
  update-client:  { repository: clients, operation: update }
  delete-client:  { repository: clients, operation: delete }

controllers:
  clients:
    base_path: /clients
    routes:
      list:   { service: list-clients,   method: GET,    path: /,     access: authenticated }
      get:    { service: get-client,     method: GET,    path: /{id}, access: authenticated }
      create: { service: create-client,  method: POST,   path: /,     access: public }
      update: { service: update-client,  method: PATCH,  path: /{id}, access: authenticated }
      delete: { service: delete-client,  method: DELETE, path: /{id}, access: authenticated }
