version: "0.2"

api:
  operations:
    defaults: { list: true, get: true, create: true, update: true, delete: true }

entities:
  client:
    type: auth
    auth:
      via:
        - provider: apiKey
          identifier: clientId
    fields:
      id:
        type: id
      clientId:
        type: string
        required: true
        unique: true
      apiKey:
        type: string
        required: true
      name:
        type: string
        required: true
      active:
        type: boolean
        default: true

# CRUD is implicit. No custom operations needed here.
repositories:
  clients:
    entity: client

# Services: only expose the operations we want.
# replace is available at the repo level but intentionally not exposed.
services:
  list_clients:   { repository: clients, operation: list }
  get_client:     { repository: clients, operation: get }
  create_client:  { repository: clients, operation: create }
  update_client:  { repository: clients, operation: update }
  delete_client:  { repository: clients, operation: delete }

controllers:
  clients:
    base_path: /clients
    routes:
      list:   { service: list_clients,   method: GET,    path: /,     access: "*" }
      get:    { service: get_client,     method: GET,    path: "/{id}", access: "*" }
      create: { service: create_client,  method: POST,   path: /,     access: public }
      update: { service: update_client,  method: PATCH,  path: "/{id}", access: "*" }
      delete: { service: delete_client,  method: DELETE, path: "/{id}", access: "*" }
