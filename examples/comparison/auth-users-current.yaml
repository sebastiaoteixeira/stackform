version: "0.1"

api:
  basePath: /api
  version: v1

collections:
  users:
    type: auth
    auth:
      identifier: email
      via: password
    access:
      create: public
      list: authenticated
      get: authenticated
      update: authenticated
      replace: authenticated
      delete:
        - principal: identity:users
          when: "principal.sub == document.id"
    fields:
      id:
        type: id
      email:
        type: string
        required: true
        unique: true
        format: email
      displayName:
        type: string
        required: true
      role:
        type: enum
        values: [admin, moderator, user]
        default: user

  posts:
    access:
      create: public
      list: public
      get: public
      update: authenticated
      delete:
        - principal: identity:users
          when: "principal.sub == document.authorId"
        - principal: identity:users
          when: "principal.record.role == 'moderator'"
    fields:
      id:
        type: id
      title:
        type: string
        required: true
      content:
        type: string
      authorId:
        type: ref
        ref: users
    operations:
      my-posts:
        base: list
        path: /posts/mine
        access: authenticated
        filter:
          authorId: $principal
