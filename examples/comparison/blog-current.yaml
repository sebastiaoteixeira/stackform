version: "0.1"

api:
  operations:
    defaults:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true

collections:
  posts:
    fields:
      id:
        type: id
      title:
        type: string
        required: true
        minLength: 3
      content:
        type: string
        required: true
      tags:
        type: array
        items:
          type: string
      publishedAt:
        type: datetime
      authorId:
        type: ref
        ref: users

  users:
    fields:
      id:
        type: id
      username:
        type: string
        required: true
        unique: true
      bio:
        type: string
      age:
        type: number
