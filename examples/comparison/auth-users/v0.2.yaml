version: "0.2"

api:
  basePath: /api
  version: v1
  operations:
    defaults:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true

imports:
  posts: myapp.handlers.posts

mongo:
  uri: mongodb://localhost:27017
  database: myapp

entities:
  user:
    type: auth # This type implies built-in auth handling, password hashing, etc.
    auth:
      identifier: email
      via: password
    fields:
      id:
        type: id
      email:
        type: string
        required: true
        unique: true
        format: email
      displayName:
        type: string
        required: true
      role:
        type: enum
        values: [admin, moderator, user]
        default: user

  post:
    fields:
      id:
        type: id
      title:
        type: string
        required: true
      content:
        type: string
      authorId:
        type: ref
        ref: user
    operations:
      replace: true # Override default to allow full replacement of post documents.

# by-author is a DB query — it belongs here.
# Registered by @repository_op("posts", "by-author") in custom/posts.py.
repositories:
  users:
    entity: user

  posts:
    entity: post

# publish-post is business logic — it belongs here.
services:
  register:     { repository: users, operation: create }
  login:
    repository: users

  list-users:   { repository: users, operation: list }
  get-user:     { repository: users, operation: get }
  update-user:  { repository: users, operation: update }
  delete-user:  { repository: users, operation: delete }

  list-posts:   { repository: posts, operation: list }
  get-post:     { repository: posts, operation: get }
  create-post:  { repository: posts, operation: create }
  update-post:  { repository: posts, operation: update }
  delete-post:  { repository: posts, operation: delete }
  my-posts:     { repository: posts, operation: by-author }
  publish-post:
    handler: posts.publish

controllers:
  auth:
    base_path: /auth
    routes:
      register: { service: register, method: POST, path: /register, access: public }
      login:    { service: login,    method: POST, path: /login,    access: public }

  users:
    base_path: /users
    routes:
      list:   { service: list-users,   method: GET,    path: /,       access: authenticated }
      get:    { service: get-user,     method: GET,    path: "/{id}", access: authenticated }
      update: { service: update-user,  method: PATCH,  path: "/{id}", access: authenticated }
      delete:
        service: delete-user
        method: DELETE
        path: /{id}
        access:
          - principal: identity:users
            when: "principal.sub == document.id"

  posts:
    base_path: /posts
    routes:
      list:     { service: list-posts,    method: GET,    path: /,              access: public }
      get:      { service: get-post,      method: GET,    path: "/{id}",       access: public }
      create:   { service: create-post,   method: POST,   path: /,              access: public }
      update:   { service: update-post,   method: PATCH,  path: "/{id}",       access: authenticated }
      my-posts: { service: my-posts,      method: GET,    path: /mine,          access: authenticated }
      publish:  { service: publish-post,  method: POST,   path: "/{id}/publish", access: authenticated }
      delete:
        service: delete-post
        method: DELETE
        path: /{id}
        access:
          - principal: identity:users
            when: "principal.sub == document.authorId"
          - principal: identity:users
            when: "principal.record.role == 'moderator'"
