version: "0.2"

api:
  basePath: /api
  version: v1
  operations:
    defaults:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true

imports:
  posts: post_actions

mongo:
  uri: mongodb://localhost:27017
  database: myapp

entities:
  user:
    type: auth
    auth:
      via:
        - provider: password
          identifier: email
    fields:
      id:
        type: id
      email:
        type: string
        required: true
        unique: true
        format: email
      displayName:
        type: string
        required: true
      role:
        type: enum
        values: [admin, moderator, user]
        default: user

  post:
    fields:
      id:
        type: id
      title:
        type: string
        required: true
      content:
        type: string
      authorId:
        type: ref
        ref: user
      published:
        type: boolean
        default: false

# by_author is a DB query — it belongs here.
repositories:
  users:
    entity: user

  posts:
    entity: post
    operations:
      by_author:
        query:
          command: find
          filter: { authorId: "{{authorId}}" }

# publish_post is business logic — it belongs here.
services:
  register:     { repository: users, operation: create }
  login:
    repository: users

  list_users:   { repository: users, operation: list }
  get_user:     { repository: users, operation: get }
  update_user:  { repository: users, operation: update }
  delete_user:  { repository: users, operation: delete }

  list_posts:   { repository: posts, operation: list }
  get_post:     { repository: posts, operation: get }
  create_post:  { repository: posts, operation: create }
  update_post:  { repository: posts, operation: update }
  replace_post: { repository: posts, operation: replace }
  delete_post:  { repository: posts, operation: delete }
  posts_by_author: { repository: posts, operation: by_author }
  publish_post:
    handler: posts.publish

controllers:
  auth:
    base_path: /auth
    routes:
      register: { service: register, method: POST, path: /register, access: public }
      login:    { service: login,    method: POST, path: /login,    access: public }

  users:
    base_path: /users
    routes:
      list:   { service: list_users,   method: GET,    path: /,       access: "*" }
      get:    { service: get_user,     method: GET,    path: "/{id}", access: "*" }
      update: { service: update_user,  method: PATCH,  path: "/{id}", access: "*" }
      delete:
        service: delete_user
        method: DELETE
        path: /{id}
        access:
          - given:
              principal: identity:user
              document: users
            when: principal.sub equals document.id

  posts:
    base_path: /posts
    routes:
      list:     { service: list_posts,    method: GET,    path: /,              access: public }
      get:      { service: get_post,      method: GET,    path: "/{id}",       access: public }
      create:   { service: create_post,   method: POST,   path: /,              access: public }
      update:   { service: update_post,   method: PATCH,  path: "/{id}",       access: "*" }
      replace:  { service: replace_post,  method: PUT,    path: "/{id}",       access: "*" }
      by-author: { service: posts_by_author, method: GET, path: "/by-author/{authorId}", access: "*" }
      publish:  { service: publish_post,  method: POST,   path: "/{id}/publish", access: "*" }
      delete:
        service: delete_post
        method: DELETE
        path: /{id}
        access:
          - given:
              principal: identity:user
              document: posts
            when: principal.sub equals document.authorId
          - given:
              principal: identity:user
            when: principal.record.role equals 'moderator'
