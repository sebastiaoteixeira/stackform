version: "0.1"

api:
  basePath: /api
  version: v1
  operations:
    defaults:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true

mongo:
  uri: mongodb://localhost:27017
  database: myapp

collections:
  users:
    type: auth
    auth:
      identifier: email
      via: password
    access:
      create: public
      list: authenticated
      get: authenticated
      update: authenticated
      replace: authenticated
      delete:
        - principal: "users:*"
          when: "principal.sub equals document.id"
    fields:
      id:
        type: id
      email:
        type: string
        required: true
        unique: true
        format: email
      displayName:
        type: string
        required: true
      role:
        type: enum
        values: [admin, moderator, user]
        default: user

  posts:
    access:
      create: public
      list: public
      get: public
      update: authenticated
      delete:
        - principal: "users:*"
          when: "principal.sub equals document.authorId"
        - principal: "users:*"
          when: "principal.record.role equals 'moderator'"
    fields:
      id:
        type: id
      title:
        type: string
        required: true
      content:
        type: string
      authorId:
        type: ref
        ref: users
    # v0.1 has no custom operations: "my posts" and "publish" cannot be declared,
    # and the YAML could not say whether each is a DB query or business logic.
    # v0.2 separates them into repository operations and service handlers.
