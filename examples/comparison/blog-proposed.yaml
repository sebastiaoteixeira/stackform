version: "0.2"

api:
  operations:
    defaults: [list, get, create, update, delete]

# Entities: data shape only. No operations, no HTTP.
entities:
  post:
    fields:
      id:
        type: id
      title:
        type: string
        required: true
        minLength: 3
      content:
        type: string
        required: true
      tags:
        type: array
        items:
          type: string
      publishedAt:
        type: datetime
      authorId:
        type: ref
        ref: user

  user:
    fields:
      id:
        type: id
      username:
        type: string
        required: true
        unique: true
      bio:
        type: string
      age:
        type: number

# Repositories: data access capabilities.
# CRUD (list, get, create, update, replace, delete) is implicit.
# Custom operations can be added explicitly.
repositories:
  posts:
    entity: post
    operations:
      by-author:
        base: list
        filter: { authorId: $param.authorId }

  users:
    entity: user

# Services: business operations. Each one delegates to a repo op or runs custom logic.
# Controllers can only reference services, never repositories directly.
services:
  list-posts:   { repository: posts, operation: list }
  get-post:     { repository: posts, operation: get }
  create-post:  { repository: posts, operation: create }
  update-post:  { repository: posts, operation: update }
  delete-post:  { repository: posts, operation: delete }

  list-users:   { repository: users, operation: list }
  get-user:     { repository: users, operation: get }
  create-user:  { repository: users, operation: create }
  update-user:  { repository: users, operation: update }
  delete-user:  { repository: users, operation: delete }

# Controllers: HTTP binding. References services only.
controllers:
  posts:
    base_path: /posts
    routes:
      list:   { service: list-posts,   method: GET,    path: /,     access: public }
      get:    { service: get-post,     method: GET,    path: /{id}, access: public }
      create: { service: create-post,  method: POST,   path: /,     access: public }
      update: { service: update-post,  method: PATCH,  path: /{id}, access: public }
      delete: { service: delete-post,  method: DELETE, path: /{id}, access: public }

  users:
    base_path: /users
    routes:
      list:   { service: list-users,   method: GET,    path: /,     access: public }
      get:    { service: get-user,     method: GET,    path: /{id}, access: public }
      create: { service: create-user,  method: POST,   path: /,     access: public }
      update: { service: update-user,  method: PATCH,  path: /{id}, access: public }
      delete: { service: delete-user,  method: DELETE, path: /{id}, access: public }
