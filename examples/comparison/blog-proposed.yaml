version: "0.2"

api:
  operations:
    defaults: { list: true, get: true, create: true, update: true, delete: true }

# Entities: data shape only. No operations, no HTTP.
entities:
  post:
    fields:
      id:
        type: id
      title:
        type: string
        required: true
        minLength: 3
      content:
        type: string
        required: true
      tags:
        type: array
        items:
          type: string
      publishedAt:
        type: datetime
      authorId:
        type: ref
        ref: user

  user:
    fields:
      id:
        type: id
      username:
        type: string
        required: true
        unique: true
      bio:
        type: string
      age:
        type: number

# Repositories: data access capabilities.
# CRUD (list, get, create, update, replace, delete) is implicit.
# Custom operations can be added explicitly.
repositories:
  posts:
    entity: post
    operations:
      by_author:
        query:
          command: find
          filter: { authorId: "{{authorId}}" }

  users:
    entity: user

# Services: business operations. Each one delegates to a repo op or runs custom logic.
# Controllers can only reference services, never repositories directly.
services:
  list_posts:   { repository: posts, operation: list }
  get_post:     { repository: posts, operation: get }
  create_post:  { repository: posts, operation: create }
  update_post:  { repository: posts, operation: update }
  delete_post:  { repository: posts, operation: delete }

  list_users:   { repository: users, operation: list }
  get_user:     { repository: users, operation: get }
  create_user:  { repository: users, operation: create }
  update_user:  { repository: users, operation: update }
  delete_user:  { repository: users, operation: delete }

# Controllers: HTTP binding. References services only.
controllers:
  posts:
    base_path: /posts
    routes:
      list:   { service: list_posts,   method: GET,    path: /,     access: public }
      get:    { service: get_post,     method: GET,    path: "/{id}", access: public }
      create: { service: create_post,  method: POST,   path: /,     access: public }
      update: { service: update_post,  method: PATCH,  path: "/{id}", access: public }
      delete: { service: delete_post,  method: DELETE, path: "/{id}", access: public }

  users:
    base_path: /users
    routes:
      list:   { service: list_users,   method: GET,    path: /,     access: public }
      get:    { service: get_user,     method: GET,    path: "/{id}", access: public }
      create: { service: create_user,  method: POST,   path: /,     access: public }
      update: { service: update_user,  method: PATCH,  path: "/{id}", access: public }
      delete: { service: delete_user,  method: DELETE, path: "/{id}", access: public }
