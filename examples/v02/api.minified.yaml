version: "0.2"

api:
  basePath: /api
  version: v1
  operations:
    defaults:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true
    auth:
      register: true
      login: true

imports:
  posts: myapp.handlers.posts

mongo:
  uri: mongodb://localhost:27017
  database: myapp

entities:
  base:
    abstract: true
    fields:
      id: { type: id }
      createdAt: { type: datetime }

  user:
    extends: base
    type: auth
    auth:
      identifier: email
      via: password
      roles: role
    fields:
      email:
        type: string
        required: true
        unique: true
        format: email
      displayName:
        type: string
        required: true
      role:
        type: enum
        values: [admin, moderator, user]
        default: user

  post:
    extends: base
    fields:
      title:
        type: string
        required: true
      content:
        type: string
      authorId:
        type: ref
        ref: user
      published:
        type: boolean
        default: false

  country:
    pk: code
    fields:
      code: { type: string }
      name: { type: string }

roles:
  user:
    admin: [moderator]
    moderator: [user]

repositories:
  users:
    entity: user
  posts:
    entity: post
    operations:
      replace: true
  countries:
    entity: country

services:
  users:
    repository: users
  posts:
    repository: posts
    operations:
      publish: { handler: posts.publish }
  countries:
    repository: countries

controllers:
  users:
    service: users
    base_path: /users
    access: "*"
    operations:
      register: { access: public }
      login:    { access: public }
      delete:
        access:
          - given:
              principal: identity:user
              document: users
            when: principal.sub equals document.id

  posts:
    service: posts
    base_path: /posts
    access: public
    operations:
      create: { access: "*" }
      update:
        access:
          - admin
          - given:
              principal: identity:user
              document: posts
            when: principal.sub not equals document.authorId
            then: deny
          - then: allow
      replace: { access: "*" }
      publish: { method: POST, path: "/{id}/publish", access: "*" }
      delete:
        access:
          - moderator
          - given:
              principal: identity:user
              document: posts
            when: principal.sub equals document.authorId

  countries:
    service: countries
    base_path: /countries
    access: public
    operations:
      create: { access: admin }
      update: { access: admin }
      delete: { access: admin }
