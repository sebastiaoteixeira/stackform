version: "0.2"

api:
  basePath: /api
  version: v1
  operations:
    defaults:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true

imports:
  posts: myapp.handlers.posts

mongo:
  uri: mongodb://localhost:27017
  database: myapp

entities:
  user:
    type: auth
    via:
      - provider: password
        identifier: email
    roles: role
    fields:
      id:
        type: id
      email:
        type: string
        required: true
        unique: true
        format: email
      displayName:
        type: string
        required: true
      role:
        type: enum
        values: [admin, moderator, user]
        default: user

  post:
    fields:
      id:
        type: id
      title:
        type: string
        required: true
      content:
        type: string
      authorId:
        type: ref
        ref: user
      published:
        type: boolean
        default: false

roles:
  user:
    admin: [moderator]
    moderator: [user]

repositories:
  users:
    entity: user

  posts:
    entity: post
    operations:
      replace: true

services:
  register:     { repository: users, operation: create }
  login:
    repository: users

  list-users:   { repository: users, operation: list }
  get-user:     { repository: users, operation: get }
  update-user:  { repository: users, operation: update }
  delete-user:  { repository: users, operation: delete }

  list-posts:   { repository: posts, operation: list }
  get-post:     { repository: posts, operation: get }
  create-post:  { repository: posts, operation: create }
  update-post:  { repository: posts, operation: update }
  delete-post:  { repository: posts, operation: delete }
  publish-post:
    handler: posts.publish

controllers:
  auth:
    base_path: /auth
    routes:
      register: { service: register, method: POST, path: /register, access: public }
      login:    { service: login,    method: POST, path: /login,    access: public }

  users:
    base_path: /users
    routes:
      list:   { service: list-users,  method: GET,    path: /,       access: "*" }
      get:    { service: get-user,    method: GET,    path: "/{id}", access: "*" }
      update: { service: update-user, method: PATCH,  path: "/{id}", access: "*" }
      delete:
        service: delete-user
        method: DELETE
        path: /{id}
        access:
          - given:
              principal: identity:user
              document: users
            when: principal.sub equals document.id

  posts:
    base_path: /posts
    routes:
      list:    { service: list-posts,   method: GET,  path: /,                access: public }
      get:     { service: get-post,     method: GET,  path: "/{id}",          access: public }
      create:  { service: create-post,  method: POST, path: /,               access: "*" }
      update:
        service: update-post
        method: PATCH
        path: "/{id}"
        access:
          - given:
              principal: identity:user
              document: posts
            when: principal.sub not equals document.authorId
            then: deny
          - then: allow
      publish: { service: publish-post, method: POST, path: "/{id}/publish", access: "*" }
      delete:
        service: delete-post
        method: DELETE
        path: /{id}
        access:
          - given:
              principal: identity:user
              document: posts
            when: principal.sub equals document.authorId
          - given:
              principal: identity:user
            when: principal.record.role equals 'moderator'
