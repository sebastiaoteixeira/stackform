version: "0.2"

api:
  basePath: /api
  version: v1
  operations:
    defaults:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true
    auth:
      register: true
      login: true

imports:
  posts: myapp.handlers.posts

mongo:
  uri: mongodb://localhost:27017
  database: myapp

entities:
  user:
    type: auth
    auth:
      via:
        - provider: password
          identifier: email
    roles:
      values: [admin, moderator, user]
      default: user
      hierarchy:
        admin: [moderator]
        moderator: [user]
    fields:
      id:
        type: id
      email:
        type: string
        required: true
        unique: true
        format: email
      displayName:
        type: string
        required: true

  post:
    fields:
      id:
        type: id
      title:
        type: string
        required: true
      content:
        type: string
      authorId:
        type: ref
        ref: user
      published:
        type: boolean
        default: false

repositories:
  users:
    entity: user
  posts:
    entity: post
    crud: [list, get, create, update, replace, delete]

services:
  users:
    repository: users
  posts:
    repository: posts
    operations:
      publish: { handler: posts.publish }

controllers:
  users:
    service: users
    base_path: /users
    access: "*"
    operations:
      register: { access: public }
      login: { access: public }
      delete:
        access:
          - given:
              principal: identity:user
              document: users
            when: principal.sub equals document.id

  posts:
    service: posts
    base_path: /posts
    access: public
    operations:
      create: { access: "*" }
      update:
        access:
          - admin
          - given:
              principal: identity:user
              document: posts
            when: principal.sub not equals document.authorId
            then: deny
          - then: allow
      replace: { access: "*" }
      publish: { method: POST, path: "/{id}/publish", access: "*" }
      delete:
        access:
          - moderator
          - given:
              principal: identity:user
              document: posts
            when: principal.sub equals document.authorId
