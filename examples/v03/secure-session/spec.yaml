version: "0.3"

api:
  basePath: /api

session:
  algorithm: RS256
  ttl: 900
  refresh: true
  delivery: cookie

mongo:
  uri: mongodb://localhost:27017
  database: yaml_v03_sessions

entities:
  user:
    type: auth
    auth:
      identifier: email
      via: password
    fields:
      id: { type: id }
      email: { type: string, required: true, unique: true, format: email }
      displayName: { type: string, required: true }

repositories:
  users:
    entity: user

services:
  users:
    repository: users

controllers:
  users:
    service: users
    base_path: /users
    access: "*"
    operations:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true
