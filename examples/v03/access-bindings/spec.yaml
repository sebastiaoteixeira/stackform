version: "0.3"

api:
  name: v03-access-bindings
  basePath: /api

mongo:
  uri: mongodb://localhost:27017
  database: yaml_v03_access

entities:
  user:
    type: auth
    auth:
      identifier: email
      via: password
    fields:
      id: { type: id }
      email: { type: string, required: true, unique: true, format: email }
      displayName: { type: string, required: true }
  organization:
    fields:
      id: { type: id }
      slug: { type: string, required: true, unique: true }
      ownerId: { type: string, required: true }
      active: { type: boolean, required: true }
  post:
    fields:
      id: { type: id }
      organizationId: { type: string, required: true }
      ownerId: { type: string, required: true }
      title: { type: string, required: true }
      state: { type: string, required: true }

repositories:
  users:
    entity: user
  organizations:
    entity: organization
  posts:
    entity: post
    operations:
      ownedPost:
        query:
          command: findOne
          filter:
            id: $postId
            ownerId: $actorId

services:
  organizations:
    repository: organizations
  posts:
    repository: posts
  ownedPost:
    repository: posts
    operation: ownedPost
    input:
      actor: string
    with:
      actorId: $actor

controllers:
  organizations:
    base_path: /organizations
    routes:
      listOwned:
        service: organizations
        method: GET
        path: /{organizationSlug}
        access:
          - given:
              principal: identity:user
              organization: organizations where slug = $organizationSlug and active = true
            when: organization.ownerId equals principal.sub
          - then: deny
            reason: Only the active organization's owner may list it.
  posts:
    base_path: /organizations
    routes:
      get:
        service: posts
        method: GET
        path: /{organizationId}/posts/{postId}
        access:
          - given:
              principal: identity:user
              post: posts
            when: post.ownerId equals principal.sub
          - then: deny
            reason: Only the post owner may read it.
      owned:
        service: ownedPost
        method: GET
        path: /{organizationId}/posts/{postId}/owned
        access:
          - given:
              principal: identity:user
            bind:
              actor: $principal.sub
