version: "0.3"

api:
  basePath: /api
  version: v1
  operations:
    auth:
      register: true
      login: true

mongo:
  uri: mongodb://localhost:27017
  database: access_control_db

entities:
  user:
    type: auth
    auth:
      identifier: email
      via: password
    roles:
      values: [admin, editor, viewer]
      default: viewer
      hierarchy:
        admin: [editor]
        editor: [viewer]
    fields:
      id: { type: id }
      email: { type: string, required: true, unique: true, format: email }
      name: { type: string, required: true }
      department: { type: string }

  article:
    fields:
      id: { type: id }
      title: { type: string, required: true }
      content: { type: string, required: true }
      author_id: { type: string, required: true, readonly: true }
      status:
        type: enum
        values: [draft, published, archived]
        default: draft
      department: { type: string }
      is_public: { type: boolean, default: false }

  sensitive_data:
    fields:
      id: { type: id }
      title: { type: string, required: true }
      public_info: { type: string }
      restricted_info: { type: string }
      confidential_info: { type: string }
      owner_id: { type: string, required: true, readonly: true }

repositories:
  users:
    entity: user
    crud: [create, list, get, update, delete]

  articles:
    entity: article
    crud: [create, list, get, update, delete]

  sensitive_data:
    entity: sensitive_data
    crud: [create, list, get, update, delete]

services:
  users:
    repository: users

  articles:
    repository: articles

  authoredArticles:
    repository: articles
    operation: create
    input:
      title: { type: string, required: false }
      content: { type: string, required: false }
      author_id: string
      status: { type: enum, values: [draft, published, archived], required: false }
      department: { type: string, required: false }
      is_public: { type: boolean, required: false }

  sensitive_data:
    repository: sensitive_data

  ownedSensitiveData:
    repository: sensitive_data
    operation: create
    input:
      title: { type: string, required: false }
      owner_id: string
      public_info: { type: string, required: false }
      restricted_info: { type: string, required: false }
      confidential_info: { type: string, required: false }

controllers:
  users:
    base_path: /users
    service: users
    access: admin
    operations:
      register: { access: public }
      login: { access: public }
      get:
        access:
          - admin
          - given:
              principal: identity:user
              document: users
            when: principal.sub equals document.id
      update:
        access:
          - admin
          - given:
              principal: identity:user
              document: users
            when: principal.sub equals document.id

  articles:
    base_path: /articles
    service: articles
    access: admin
    operations:
      create: false
      list: { access: viewer }
      get:
        access:
          - admin
          - given:
              principal: identity:user
              document: articles
            when: principal.sub equals document.author_id
      update:
        access:
          - admin
          - given:
              principal: identity:user
              document: articles
            when: principal.sub equals document.author_id

  authoring:
    base_path: /articles
    routes:
      create:
        service: authoredArticles
        method: POST
        path: ""
        access:
          - given:
              principal: identity:user
            bind:
              author_id: $principal.sub

  sensitive_data:
    base_path: /sensitive
    service: sensitive_data
    access: admin
    operations:
      create: false
      list:
        access:
          - admin
          - given:
              principal: identity:user
              document: sensitive_data
            when: principal.sub equals document.owner_id
      get:
        access:
          - admin
          - given:
              principal: identity:user
              document: sensitive_data
            when: principal.sub equals document.owner_id
      update:
        access:
          - admin
          - given:
              principal: identity:user
              document: sensitive_data
            when: principal.sub equals document.owner_id

  sensitive_authoring:
    base_path: /sensitive
    routes:
      create:
        service: ownedSensitiveData
        method: POST
        path: ""
        access:
          - given:
              principal: identity:user
            bind:
              owner_id: $principal.sub
