version: "0.3"

api:
  name: organization-reports
  basePath: /api
  version: v1

mongo:
  uri: mongodb://localhost:27017
  database: organization_reports

entities:
  user:
    type: auth
    auth:
      identifier: email
      via: password
    fields:
      id: { type: id }
      email: { type: string, required: true, unique: true }

  organization:
    fields:
      id: { type: id }
      ownerId: { type: string, required: true }
      name: { type: string, required: true }

  report:
    fields:
      id: { type: id }
      organizationId: { type: string, required: true }
      title: { type: string, required: true }

repositories:
  users: { entity: user }
  organizations: { entity: organization }
  reports: { entity: report }

services:
  reports: { repository: reports }

controllers:
  reports:
    base_path: /organizations
    routes:
      list:
        service: reports
        method: GET
        path: /{organizationId}/reports
        access:
          - given:
              principal: identity:user
              organization: organizations where id = $organizationId
            when: organization.ownerId equals principal.sub
