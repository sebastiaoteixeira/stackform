version: "0.3"

api:
  name: v03-oidc-pkce-dpop
  basePath: /api

providers:
  identity:
    type: oidc
    client_id: yaml-v03-example
    client_secret: "${OIDC_CLIENT_SECRET:-development-only}"
    discovery_url: "${OIDC_DISCOVERY_URL:-http://localhost:8080/.well-known/openid-configuration}"
    pkce: true
    dpop: true

mongo:
  uri: mongodb://localhost:27017
  database: yaml_v03_oidc

entities:
  user:
    type: auth
    auth:
      identifier: email
      via:
        - provider: identity
          identifier: email
          claim_mapping:
            email: email
            displayName: name
          auto_provision: true
    fields:
      id: { type: id }
      email: { type: string, required: true, unique: true, format: email }
      displayName: { type: string, required: true }

repositories:
  users:
    entity: user

services:
  users:
    repository: users

controllers:
  users:
    service: users
    base_path: /users
    access: "*"
    operations:
      list: true
      get: true
      create: false
      update: false
      replace: false
      delete: false
