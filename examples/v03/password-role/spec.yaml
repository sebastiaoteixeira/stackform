version: "0.3"

api:
  basePath: /api
  version: v1
  operations:
    defaults:
      list: true
      get: true
      create: false
      update: false
      replace: false
      delete: false
    auth:
      register: true
      login: true

datastores:
  local:
    type: postgres
    dsn: sqlite+aiosqlite:///v03-password-role.sqlite
    default: true

entities:
  user:
    type: auth
    auth:
      identifier: email
      via: password
    roles:
      values: [admin, user]
      default: user
    fields:
      id: { type: id }
      email: { type: string, required: true, unique: true, format: email }
      displayName: { type: string, required: true }

repositories:
  users:
    entity: user

services:
  users:
    repository: users

controllers:
  users:
    service: users
    base_path: /users
    access: "*"
    operations:
      register: { access: public }
      login: { access: public }
      list: { access: user }
      get: { access: "*" }
