version: "0.2"

api:
  basePath: /api
  version: v1

mongo:
  uri: mongodb://localhost:27017
  database: path_params_db

entities:
  post:
    fields:
      id: { type: id }
      slug: { type: string, required: true, unique: true }
      title: { type: string, required: true }
      content: { type: string, required: true }
      published: { type: boolean, default: false }
      author_id: { type: string, required: true }

  comment:
    fields:
      id: { type: id }
      post_id: { type: string, required: true }
      content: { type: string, required: true }
      author_id: { type: string, required: true }

  category:
    fields:
      id: { type: id }
      slug: { type: string, required: true, unique: true }
      name: { type: string, required: true }
      description: { type: string }

repositories:
  posts:
    entity: post
    crud: [create, list, get, update, delete]
    operations:
      by_slug:
        query:
          command: findOne
          filter: { slug: "{{slug}}" }

  comments:
    entity: comment
    crud: [create, list, get, update, delete]
    operations:
      by_post:
        query:
          command: find
          filter: { post_id: "{{post_id}}" }

  categories:
    entity: category
    crud: [create, list, get, update, delete]
    operations:
      by_slug:
        query:
          command: findOne
          filter: { slug: "{{slug}}" }

services:
  posts:
    repository: posts

  comments:
    repository: comments

  list_comments_for_post:
    repository: comments
    operation: by_post

  create_comment_for_post:
    repository: comments
    operation: create

  get_comment:
    repository: comments
    operation: get

  update_comment:
    repository: comments
    operation: update

  delete_comment:
    repository: comments
    operation: delete

  categories:
    repository: categories

controllers:
  posts:
    base_path: /posts
    service: posts
    access: public

  comments:
    base_path: /posts
    routes:
      list_for_post:
        method: GET
        path: /{post_id}/comments
        service: list_comments_for_post
        access: public
      create_for_post:
        method: POST
        path: /{post_id}/comments
        service: create_comment_for_post
        access: public
      get_comment:
        method: GET
        path: /{post_id}/comments/{id}
        service: get_comment
        access: public
      update_comment:
        method: PUT
        path: /{post_id}/comments/{id}
        service: update_comment
        access: public
      delete_comment:
        method: DELETE
        path: /{post_id}/comments/{id}
        service: delete_comment
        access: public

  categories:
    base_path: /categories
    service: categories
    access: public
