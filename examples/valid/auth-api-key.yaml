version: "0.1"

collections:
  clients:
    type: auth
    auth:
      identifier: clientId
      via: [apiKey]
    fields:
      id:
        type: id
      clientId:
        type: string
        required: true
        unique: true
      apiKey:
        type: string
        required: true
      name:
        type: string
        required: true
      active:
        type: boolean
        default: true
