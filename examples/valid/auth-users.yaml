version: "0.1"

api:
  basePath: /api
  version: v1

collections:
  users:
    type: auth
    auth:
      identifier: email
      via: password
    access:
      create: public
      list: "*"
      get: "*"
      update: "*"
      replace: "*"
      delete:
        - principal: "users:*"
          when: "principal.sub equals document.id"
    fields:
      id:
        type: id
      email:
        type: string
        required: true
        unique: true
        format: email
      displayName:
        type: string
        required: true
      role:
        type: enum
        values: [admin, user]
        default: user

  posts:
    access:
      create: public
      list: public
      get: public
      update: "*"
      delete: "*"
    fields:
      id:
        type: id
      title:
        type: string
        required: true
      content:
        type: string
      authorId:
        type: ref
        ref: users
