version: "0.2"

api:
  basePath: /api
  version: v1
  port: 80
  cors:
    origins: ["*"]
  operations:
    defaults:
      list: true
      get: true
      create: true
      update: true
      replace: false
      delete: true
    auth:
      register: true
      login: true

datastores:
  default:
    type: mongodb
    uri: mongodb://localhost:27017
    database: trustrisk

providers:
  keycloak:
    type: oidc
    client_id: trustrisk
    client_secret: "${KEYCLOAK_CLIENT_SECRET}"
    discovery_url: "${KEYCLOAK_DISCOVERY_URL:-http://keycloak:8080/realms/trustrisk/.well-known/openid-configuration}"

entities:
  baseModel:
    abstract: true
    fields:
      id: { type: id }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }
      removedAt: { type: datetime }
      removed: { type: boolean, default: false }

  language:
    fields:
      id: { type: id }
      code: { type: string, maxLength: 10, unique: true, required: true }
      name: { type: string, maxLength: 50, required: true }

  user:
    type: auth
    auth:
      identifier: email
      via: password1
      bindings:
        - provider: keycloak
          identifier: email
          claim_mapping:
            email: email
            name: name
            firstName: given_name
            lastName: family_name
            keycloakSub: sub
          auto_provision: true
    fields:
      id: { type: id }
      email: { type: string, maxLength: 255, required: true, unique: true, format: email }
      name: { type: string, maxLength: 150, required: true }
      keycloakSub: { type: string, maxLength: 255, unique: true, readonly: true }
      keycloakRealm: { type: string, maxLength: 100, readonly: true }
      username: { type: string, maxLength: 150 }
      firstName: { type: string, maxLength: 150 }
      lastName: { type: string, maxLength: 150 }
      isActive: { type: boolean, default: true, readonly: true }
      lastLoginAt: { type: datetime, readonly: true }
      lastSyncAt: { type: datetime, readonly: true }

  organization:
    extends: baseModel
    fields:
      name: { type: string, maxLength: 255, required: true }
      slug: { type: string, maxLength: 100, unique: true, required: true }
      description: { type: string }
      keycloakRealm: { type: string, maxLength: 100 }
      keycloakGroupId: { type: string, maxLength: 255 }
      isActive: { type: boolean, default: true }

  organizationUnit:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization, required: true }
      parentId: { type: ref, ref: organizationUnit }
      name: { type: string, maxLength: 255, required: true }
      code: { type: string, maxLength: 50 }
      description: { type: string }
      managerId: { type: ref, ref: user }

  organizationMembership:
    extends: baseModel
    fields:
      userId: { type: ref, ref: user, required: true }
      organizationId: { type: ref, ref: organization, required: true }
      organizationUnitId: { type: ref, ref: organizationUnit }
      isActive: { type: boolean, default: true }
      joinedAt: { type: datetime }
      invitedById: { type: ref, ref: user }

  attachment:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization, required: true }
      name: { type: string, maxLength: 255, required: true }
      filePath: { type: string, required: true }
      mimeType: { type: string, maxLength: 100 }
      size: { type: number }
      description: { type: string }
      uploadedById: { type: ref, ref: user }
      entityType: { type: string, maxLength: 100, required: true }
      entityId: { type: string, required: true }

  auditLog:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      actorId: { type: ref, ref: user }
      action:
        type: enum
        values: [create, update, delete, restore, login, logout, export, approve, reject, clone]
        required: true
      entityType: { type: string, maxLength: 100, required: true }
      entityId: { type: string, required: true }
      diff: { type: object }
      ipAddress: { type: string, maxLength: 45 }
      userAgent: { type: string, maxLength: 255 }

  riskMethodology:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      code: { type: string, maxLength: 50, required: true }
      name: { type: string, maxLength: 255, required: true }
      description: { type: string }
      impactAggregation:
        type: enum
        values: [max, sum, weighted_sum, average, product]
        default: max
      scoringFormula:
        type: enum
        values: [likelihood_x_impact, likelihood_plus_impact, fmea_rpn, custom]
        default: likelihood_x_impact
      formulaExpression: { type: string, maxLength: 255 }

  dimension:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      code: { type: string, maxLength: 50, required: true }
      name: { type: string, maxLength: 100, required: true }
      description: { type: string }
      appliesToValuation: { type: boolean, default: true }
      appliesToImpact: { type: boolean, default: true }
      direction:
        type: enum
        values: [higher_is_worse, lower_is_worse]
        default: higher_is_worse
      defaultWeight: { type: number, default: 1.0 }
      languageId: { type: ref, ref: language }

  methodologyDimension:
    extends: baseModel
    fields:
      methodologyId: { type: ref, ref: riskMethodology, required: true }
      dimensionId: { type: ref, ref: dimension, required: true }
      weight: { type: number, default: 1.0 }
      isRequired: { type: boolean, default: true }
      order: { type: number, default: 0 }

  riskAnalysisProcess:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization, required: true }
      methodologyId: { type: ref, ref: riskMethodology, required: true }
      versionNumber: { type: number, required: true }
      name: { type: string, maxLength: 255, required: true }
      description: { type: string }
      status:
        type: enum
        values: [draft, in_progress, under_review, approved, archived]
        default: draft
      clonedFromId: { type: ref, ref: riskAnalysisProcess }
      clonedAt: { type: datetime }
      highRiskLevel: { type: number, required: true }
      mediumRiskLevel: { type: number, required: true }
      isActive: { type: boolean, default: false }
      activeFrom: { type: datetime }
      activeTo: { type: datetime }
      ownerId: { type: ref, ref: user }
      approvedById: { type: ref, ref: user }
      approvedAt: { type: datetime }

  dimensionLevel:
    extends: baseModel
    fields:
      dimensionId: { type: ref, ref: dimension, required: true }
      processId: { type: ref, ref: riskAnalysisProcess, required: true }
      rank: { type: number, min: 0, required: true }
      label: { type: string, maxLength: 100, required: true }
      description: { type: string }
      numericValue: { type: number }
      riskCandidate: { type: boolean, default: false }
      colorHex: { type: string, maxLength: 7 }
      languageId: { type: ref, ref: language }

  likelihood:
    extends: baseModel
    fields:
      processId: { type: ref, ref: riskAnalysisProcess, required: true }
      value: { type: number, required: true }
      label: { type: string, maxLength: 100, required: true }
      description: { type: string, maxLength: 255 }
      languageId: { type: ref, ref: language }

  riskMatrixCell:
    extends: baseModel
    fields:
      processId: { type: ref, ref: riskAnalysisProcess, required: true }
      likelihoodId: { type: ref, ref: likelihood, required: true }
      impactRank: { type: number, required: true }
      riskLevel: { type: number, required: true }
      band:
        type: enum
        values: [low, medium, high, critical]
        required: true
      colorHex: { type: string, maxLength: 7 }

  organizationSecurityInfo:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization, required: true }
      processId: { type: ref, ref: riskAnalysisProcess, required: true }
      activitiesSecurityInfo: { type: string }
      recommendations: { type: string }
      additionalInfo: { type: string }
      isActive: { type: boolean, default: true }
      activeFrom: { type: datetime }
      activeTo: { type: datetime }

  businessProcessCategory:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      name: { type: string, maxLength: 100, required: true }
      description: { type: string }

  businessProcess:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization, required: true }
      name: { type: string, maxLength: 255, required: true }
      code: { type: string, maxLength: 50 }
      description: { type: string }
      categoryId: { type: ref, ref: businessProcessCategory }
      parentId: { type: ref, ref: businessProcess }
      ownerId: { type: ref, ref: user }
      organizationUnitId: { type: ref, ref: organizationUnit }
      isActive: { type: boolean, default: true }

  assetCategory:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      name: { type: string, maxLength: 100, required: true }
      description: { type: string }

  asset:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization, required: true }
      name: { type: string, maxLength: 255, required: true }
      description: { type: string }
      categoryId: { type: ref, ref: assetCategory }
      ownerId: { type: ref, ref: user }
      custodianId: { type: ref, ref: user }
      organizationUnitId: { type: ref, ref: organizationUnit }
      visibility:
        type: enum
        values: [public, private, restricted, confidential, sensitive]
        default: public
      isActive: { type: boolean, default: true }

  businessProcessAsset:
    extends: baseModel
    fields:
      businessProcessId: { type: ref, ref: businessProcess, required: true }
      assetId: { type: ref, ref: asset, required: true }
      role:
        type: enum
        values: [supports, produces, consumes, stores, processes]
        default: supports

  valuation:
    extends: baseModel
    fields:
      subjectType: { type: string, maxLength: 50, required: true }
      subjectId: { type: string, required: true }
      processId: { type: ref, ref: riskAnalysisProcess, required: true }
      overallRank: { type: number }
      overallValue: { type: number }
      maxDimensionId: { type: ref, ref: dimension }
      isCandidate: { type: boolean, default: false }
      notes: { type: string }

  valuationItem:
    extends: baseModel
    fields:
      valuationId: { type: ref, ref: valuation, required: true }
      dimensionId: { type: ref, ref: dimension, required: true }
      levelId: { type: ref, ref: dimensionLevel, required: true }
      rationale: { type: string }

  riskAnalysisCandidate:
    extends: baseModel
    fields:
      subjectType: { type: string, maxLength: 50, required: true }
      subjectId: { type: string, required: true }
      processId: { type: ref, ref: riskAnalysisProcess, required: true }
      reason: { type: string, required: true }
      isCandidate: { type: boolean, default: true }

  threatCategory:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      name: { type: string, maxLength: 100, required: true }
      description: { type: string }

  threatOrigin:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      acronym: { type: string, maxLength: 10, required: true }
      description: { type: string, maxLength: 255 }

  threat:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      name: { type: string, maxLength: 255, required: true }
      description: { type: string, required: true }

  threatThreatOrigin:
    extends: baseModel
    fields:
      threatId: { type: ref, ref: threat, required: true }
      threatOriginId: { type: ref, ref: threatOrigin, required: true }

  threatThreatCategory:
    extends: baseModel
    fields:
      threatId: { type: ref, ref: threat, required: true }
      threatCategoryId: { type: ref, ref: threatCategory, required: true }

  vulnerabilityType:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      type: { type: string, maxLength: 255, required: true }

  vulnerability:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      name: { type: string, maxLength: 255, required: true }
      description: { type: string, required: true }
      typeId: { type: ref, ref: vulnerabilityType }

  threatVulnerability:
    extends: baseModel
    fields:
      threatId: { type: ref, ref: threat, required: true }
      vulnerabilityId: { type: ref, ref: vulnerability, required: true }

  controlFramework:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      name: { type: string, maxLength: 100, required: true }
      version: { type: string, maxLength: 20 }
      description: { type: string }

  controlCategory:
    extends: baseModel
    fields:
      frameworkId: { type: ref, ref: controlFramework, required: true }
      code: { type: string, maxLength: 20, required: true }
      name: { type: string, maxLength: 255, required: true }
      description: { type: string }

  control:
    extends: baseModel
    fields:
      frameworkId: { type: ref, ref: controlFramework, required: true }
      categoryId: { type: ref, ref: controlCategory }
      code: { type: string, maxLength: 50, required: true }
      name: { type: string, maxLength: 255, required: true }
      description: { type: string, required: true }
      type:
        type: enum
        values: [preventive, detective, corrective, deterrent, compensating]
        default: preventive

  controlThreat:
    extends: baseModel
    fields:
      controlId: { type: ref, ref: control, required: true }
      threatId: { type: ref, ref: threat, required: true }

  controlImplementation:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization, required: true }
      controlId: { type: ref, ref: control, required: true }
      assetId: { type: ref, ref: asset }
      businessProcessId: { type: ref, ref: businessProcess }
      processId: { type: ref, ref: riskAnalysisProcess, required: true }
      status:
        type: enum
        values: [planned, in_progress, implemented, verified, retired]
        default: planned
      effectiveness:
        type: enum
        values: [not_assessed, ineffective, partially_effective, effective, highly_effective]
        default: not_assessed
      responsibleId: { type: ref, ref: user }
      implementedAt: { type: datetime }
      lastReviewedAt: { type: datetime }
      nextReviewDue: { type: datetime }
      notes: { type: string }

  riskCategory:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      code: { type: string, maxLength: 50, required: true }
      name: { type: string, maxLength: 255, required: true }
      description: { type: string }
      parentId: { type: ref, ref: riskCategory }

  riskStatus:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      name: { type: string, maxLength: 50, required: true }
      description: { type: string }
      isTerminal: { type: boolean, default: false }
      languageId: { type: ref, ref: language }

  risk:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization, required: true }
      reference: { type: string, maxLength: 50, required: true }
      title: { type: string, maxLength: 255, required: true }
      description: { type: string, required: true }
      categoryId: { type: ref, ref: riskCategory }
      processId: { type: ref, ref: riskAnalysisProcess, required: true }
      ownerId: { type: ref, ref: user }
      businessProcessId: { type: ref, ref: businessProcess }
      assetId: { type: ref, ref: asset }
      threatId: { type: ref, ref: threat }
      vulnerabilityId: { type: ref, ref: vulnerability }
      currentLikelihood: { type: number }
      currentImpact: { type: number }
      currentRiskLevel: { type: number }
      currentBand:
        type: enum
        values: [low, medium, high, critical]
      statusId: { type: ref, ref: riskStatus }
      identifiedAt: { type: datetime }
      identifiedById: { type: ref, ref: user }
      clonedFromId: { type: ref, ref: risk }

  riskAssessment:
    extends: baseModel
    fields:
      riskId: { type: ref, ref: risk, required: true }
      processId: { type: ref, ref: riskAnalysisProcess, required: true }
      assessorId: { type: ref, ref: user }
      assessmentType:
        type: enum
        values: [inherent, residual, target]
        default: inherent
      likelihoodId: { type: ref, ref: likelihood }
      likelihoodValue: { type: number }
      overallImpact: { type: number, required: true }
      riskLevel: { type: number, required: true }
      band:
        type: enum
        values: [low, medium, high, critical]
      assessmentDate: { type: datetime }
      comments: { type: string }

  riskAssessmentControlImplementation:
    extends: baseModel
    fields:
      riskAssessmentId: { type: ref, ref: riskAssessment, required: true }
      controlImplementationId: { type: ref, ref: controlImplementation, required: true }

  riskAssessmentImpact:
    extends: baseModel
    fields:
      assessmentId: { type: ref, ref: riskAssessment, required: true }
      dimensionId: { type: ref, ref: dimension, required: true }
      levelId: { type: ref, ref: dimensionLevel, required: true }
      value: { type: number }
      rationale: { type: string }

  riskTreatment:
    extends: baseModel
    fields:
      riskId: { type: ref, ref: risk, required: true }
      processId: { type: ref, ref: riskAnalysisProcess, required: true }
      strategy:
        type: enum
        values: [accept, mitigate, transfer, avoid]
        required: true
      justification: { type: string, required: true }
      approverId: { type: ref, ref: user }
      approvedAt: { type: datetime }
      status:
        type: enum
        values: [proposed, approved, rejected, executing, completed]
        default: proposed
      targetDate: { type: datetime }

  actionStatus:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      name: { type: string, maxLength: 50, required: true }
      description: { type: string }
      isTerminal: { type: boolean, default: false }

  actionPlan:
    extends: baseModel
    fields:
      treatmentId: { type: ref, ref: riskTreatment, required: true }
      name: { type: string, maxLength: 255, required: true }
      description: { type: string }
      ownerId: { type: ref, ref: user }
      startDate: { type: datetime }
      dueDate: { type: datetime }
      statusId: { type: ref, ref: actionStatus }

  action:
    extends: baseModel
    fields:
      planId: { type: ref, ref: actionPlan, required: true }
      controlId: { type: ref, ref: control }
      title: { type: string, maxLength: 255, required: true }
      description: { type: string }
      assigneeId: { type: ref, ref: user }
      dueDate: { type: datetime }
      completedAt: { type: datetime }
      statusId: { type: ref, ref: actionStatus }
      progress: { type: number, default: 0, min: 0, max: 100 }

  incidentSeverity:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      name: { type: string, maxLength: 50, required: true }
      rank: { type: number, required: true }
      description: { type: string }

  incidentStatus:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization }
      name: { type: string, maxLength: 50, required: true }
      description: { type: string }
      isTerminal: { type: boolean, default: false }

  incident:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization, required: true }
      reference: { type: string, maxLength: 50, required: true }
      title: { type: string, maxLength: 255, required: true }
      description: { type: string, required: true }
      occurredAt: { type: datetime, required: true }
      detectedAt: { type: datetime }
      reportedById: { type: ref, ref: user }
      assigneeId: { type: ref, ref: user }
      severityId: { type: ref, ref: incidentSeverity }
      statusId: { type: ref, ref: incidentStatus }
      rootCause: { type: string }
      resolution: { type: string }
      closedAt: { type: datetime }

  incidentAsset:
    extends: baseModel
    fields:
      incidentId: { type: ref, ref: incident, required: true }
      assetId: { type: ref, ref: asset, required: true }

  incidentBusinessProcess:
    extends: baseModel
    fields:
      incidentId: { type: ref, ref: incident, required: true }
      businessProcessId: { type: ref, ref: businessProcess, required: true }

  incidentRisk:
    extends: baseModel
    fields:
      incidentId: { type: ref, ref: incident, required: true }
      riskId: { type: ref, ref: risk, required: true }

  kri:
    extends: baseModel
    fields:
      organizationId: { type: ref, ref: organization, required: true }
      name: { type: string, maxLength: 255, required: true }
      description: { type: string }
      riskId: { type: ref, ref: risk }
      businessProcessId: { type: ref, ref: businessProcess }
      dimensionId: { type: ref, ref: dimension }
      unit: { type: string, maxLength: 50 }
      direction:
        type: enum
        values: [higher_is_worse, lower_is_worse]
        default: higher_is_worse
      thresholdGreen: { type: number }
      thresholdAmber: { type: number }
      thresholdRed: { type: number }
      frequency:
        type: enum
        values: [daily, weekly, monthly, quarterly, yearly, on_demand]
        default: monthly
      ownerId: { type: ref, ref: user }
      isActive: { type: boolean, default: true }

  kriMeasurement:
    extends: baseModel
    fields:
      kriId: { type: ref, ref: kri, required: true }
      measuredAt: { type: datetime, required: true }
      value: { type: number, required: true }
      band:
        type: enum
        values: [green, amber, red]
      measuredById: { type: ref, ref: user }
      notes: { type: string }

repositories:
  languages:
    entity: language
  users:
