deploy:
  runtime: docker
  name: trustrisk
  port: 8000

  services:
    keycloak:
      image: quay.io/keycloak/keycloak:26.0
      command: start-dev
      environment:
        - KC_DB=dev-mem
        - KEYCLOAK_ADMIN=admin
        - KEYCLOAK_ADMIN_PASSWORD=admin
        - KC_HOSTNAME=http://localhost:8080
        - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
        - KC_HOSTNAME_STRICT=false
      ports:
        - "8080:8080"