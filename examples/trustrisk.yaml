    entity: attachment
  auditLogs:
    entity: auditLog
  riskMethodologies:
    entity: riskMethodology
  dimensions:
    entity: dimension
  methodologyDimensions:
    entity: methodologyDimension
  riskAnalysisProcesses:
    entity: riskAnalysisProcess
  dimensionLevels:
    entity: dimensionLevel
  likelihoods:
    entity: likelihood
  riskMatrixCells:
    entity: riskMatrixCell
  organizationSecurityInfos:
    entity: organizationSecurityInfo
  businessProcessCategories:
    entity: businessProcessCategory
  businessProcesses:
    entity: businessProcess
  assetCategories:
    entity: assetCategory
  assets:
    entity: asset
  businessProcessAssets:
    entity: businessProcessAsset
  valuations:
    entity: valuation
  valuationItems:
    entity: valuationItem
  riskAnalysisCandidates:
    entity: riskAnalysisCandidate
  threatCategories:
    entity: threatCategory
  threatOrigins:
    entity: threatOrigin
  threats:
    entity: threat
  threatThreatOrigins:
    entity: threatThreatOrigin
  threatThreatCategories:
    entity: threatThreatCategory
  vulnerabilityTypes:
    entity: vulnerabilityType
  vulnerabilities:
    entity: vulnerability
  threatVulnerabilities:
    entity: threatVulnerability
  controlFrameworks:
    entity: controlFramework
  controlCategories:
    entity: controlCategory
  controls:
    entity: control
  controlThreats:
    entity: controlThreat
  controlImplementations:
    entity: controlImplementation
  riskCategories:
    entity: riskCategory
  riskStatuses:
    entity: riskStatus
  risks:
    entity: risk
  riskAssessments:
    entity: riskAssessment
  riskAssessmentControlImplementations:
    entity: riskAssessmentControlImplementation
  riskAssessmentImpacts:
    entity: riskAssessmentImpact
  riskTreatments:
    entity: riskTreatment
  actionStatuses:
    entity: actionStatus
  actionPlans:
    entity: actionPlan
  actions:
    entity: action
  incidentSeverities:
    entity: incidentSeverity
  incidentStatuses:
    entity: incidentStatus
  incidents:
    entity: incident
  incidentAssets:
    entity: incidentAsset
  incidentBusinessProcesses:
    entity: incidentBusinessProcess
  incidentRisks:
    entity: incidentRisk
  kris:
    entity: kri
  kriMeasurements:
    entity: kriMeasurement

services:
  languages:
    repository: languages
  users:
    repository: users
  organizations:
    repository: organizations
  organizationUnits:
    repository: organizationUnits
  organizationMemberships:
    repository: organizationMemberships
  attachments:
    repository: attachments
  auditLogs:
    repository: auditLogs
  riskMethodologies:
    repository: riskMethodologies
  dimensions:
    repository: dimensions
  methodologyDimensions:
    repository: methodologyDimensions
  riskAnalysisProcesses:
    repository: riskAnalysisProcesses
  dimensionLevels:
    repository: dimensionLevels
  likelihoods:
    repository: likelihoods
  riskMatrixCells:
    repository: riskMatrixCells
  organizationSecurityInfos:
    repository: organizationSecurityInfos
  businessProcessCategories:
    repository: businessProcessCategories
  businessProcesses:
    repository: businessProcesses
  assetCategories:
