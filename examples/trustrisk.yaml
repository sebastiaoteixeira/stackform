ui:
  frontend:
    pack: generic
    output: ./trustrisk-ui
    overwrite: always
  config:
    app_name: TrustRisk
    require_auth: false
    fonts:
      ui: IBM Plex Sans
      hand: IBM Plex Sans
      mono: IBM Plex Mono
      import_from_google: true
      use_handwritten_titles: false
    colors:
      bg: "oklch(0.98 0.002 240)"
      surface: "oklch(1 0 0)"
      ink: "oklch(0.18 0.015 240)"
      ink_dim: "oklch(0.45 0.008 240)"
      ink_faint: "oklch(0.68 0.004 240)"
      line: "oklch(0.88 0.004 240)"
      line_strong: "oklch(0.72 0.008 240)"
      fill: "oklch(0.95 0.004 240)"
      fill_2: "oklch(0.92 0.006 240)"
      accent: "oklch(0.50 0.18 25)"
      accent_soft: "oklch(0.96 0.04 25)"
      accent_ink: "oklch(0.35 0.18 25)"
      danger: "oklch(0.50 0.20 25)"
      danger_soft: "oklch(0.96 0.04 25)"
      success: "oklch(0.58 0.14 150)"
      success_soft: "oklch(0.94 0.05 150)"
      warn: "oklch(0.68 0.16 60)"
      warn_soft: "oklch(0.95 0.06 60)"
      radius: "4px"

  views:
    login:
      path: /login
      component: auth-hero-split
      props:
        hero_content:
          title: Welcome back.
          signup_title: Get started.
          subtitle: Manage risk with confidence.
          quote: The platform that changed how we approach compliance.

    dashboard:
      path: /
      component: list-card-grid
      props:
        collection: riskAnalysisProcess
        field_roles:
          title: name
          content: description
          status: status
          date: createdAt

    organizations:
      path: /organizations
      component: crud
      props:
        collection: organization
        list: list-table
        form: form-stacked
        detail: detail-two-column
        field_roles:
          title: name
          content: description

    organization_units:
      path: /organization-units
      component: crud
      props:
        collection: organizationUnit
        list: list-table
        form: form-stacked
        detail: detail-two-column
        field_roles:
          title: name
          content: description

    risk_processes:
      path: /risk-analysis-processes
      component: crud
      props:
        collection: riskAnalysisProcess
        list: list-table
        form: form-sectioned
        detail: detail-tabbed
        field_roles:
          title: name
          content: description
          status: status
          date: createdAt

    risks:
      path: /risks
      component: crud
      props:
        collection: risk
        list: list-table
        form: form-stacked
        detail: detail-two-column
        field_roles:
          title: title
          content: description
          status: currentBand
          date: identifiedAt

    risk_assessments:
      path: /risk-assessments
      component: crud
      props:
        collection: riskAssessment
        list: list-table
        field_roles:
          status: assessmentType
          date: assessmentDate

    assets:
      path: /assets
      component: crud
      props:
        collection: asset
        list: list-table
        detail: detail-two-column
        field_roles:
          title: name
          content: description
          status: visibility

    business_processes:
      path: /business-processes
      component: crud
      props:
        collection: businessProcess
        list: list-table
        field_roles:
          title: name
          content: description

    threats:
      path: /threats
      component: crud
      props:
        collection: threat
        list: list-table
        field_roles:
          title: name
          content: description

    vulnerabilities:
      path: /vulnerabilities
      component: crud
      props:
        collection: vulnerability
        list: list-table
        field_roles:
          title: name
          content: description

    controls:
      path: /controls
      component: crud
      props:
        collection: control
        list: list-grouped
        field_roles:
          title: name
          content: description
          status: type

    control_implementations:
      path: /control-implementations
      component: crud
      props:
        collection: controlImplementation
        list: list-table
        field_roles:
          status: status
          date: implementedAt

    incidents:
      path: /incidents
      component: crud
      props:
        collection: incident
        list: list-table
        detail: detail-two-column
        field_roles:
          title: title
          content: description
          date: occurredAt

    kris:
      path: /kris
      component: crud
      props:
        collection: kri
        list: list-table
        field_roles:
          title: name
          content: description
          status: direction

    action_plans:
      path: /action-plans
      component: crud
      props:
        collection: actionPlan
        list: list-table
        field_roles:
          title: name
          content: description
          date: dueDate

    actions:
      path: /actions
      component: crud
      props:
        collection: action
        list: list-table
        field_roles:
          title: title
          content: description
          date: dueDate

    users:
      path: /users
      component: crud
      props:
        collection: user
        list: list-table
        field_roles:
          title: name
          date: lastLoginAt

    methodologies:
      path: /methodologies
      component: crud
      props:
        collection: riskMethodology
        list: list-table
        field_roles:
          title: name
          content: description
          status: scoringFormula

    dimensions:
      path: /dimensions
      component: crud
      props:
        collection: dimension
        list: list-table
        field_roles:
          title: name
          content: description
          status: direction

