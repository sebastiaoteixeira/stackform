[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml-api-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pyyaml",
  "jsonschema",
  "fastapi",
  "pydantic",
  "pydantic-settings",
  "uvicorn",
  "watchfiles",
  "pymongo",
  "jinja2",
  "click",
  "pyjwt",
  "httpx",
  "simple-term-menu",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.31.0",
  "alembic>=1.18.4",
  "psycopg[binary]>=3.3.4",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
yaml-api = "yaml_api_generator.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yaml_api_generator = [
  "parsers/schemas/*.json",
  "generators/backend/*/templates/*.jinja",
  "generators/backend/shared/templates/*.jinja",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
