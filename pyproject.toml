[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml-api-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pyyaml",
  "jsonschema",
  "fastapi",
  "pydantic",
  "uvicorn",
  "pymongo",
  "jinja2",
  "click",
  "pyjwt",
  "httpx",
  "simple-term-menu",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
yaml-api = "yaml_api_generator.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yaml_api_generator = ["schemas/*.json", "parsing/schemas/*.json", "compiler/generators/*/templates/*.j2", "compiler/generators/shared/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
