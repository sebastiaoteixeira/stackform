[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackform"
version = "1.0.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = [
  "pyyaml",
  "jsonschema",
  "fastapi",
  "pydantic",
  "pydantic-settings",
  "uvicorn",
  "watchfiles",
  "pymongo",
  "jinja2",
  "click",
  "pyjwt[crypto]",
  "httpx",
  "simple-term-menu",
  "uuid-utils",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.31.0",
  "alembic>=1.18.4",
  "psycopg[binary]>=3.3.4",
  "packaging",
  "python-multipart>=0.0.32",
  "puremagic>=1.30",
  "aiobotocore>=3.9.1",
  "anyio>=4.13.0",
  "python3-saml>=1.16.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stackform = "yaml_api_generator.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yaml_api_generator = [
  "parsers/schemas/*.json",
  "generators/backend/*/templates/*.jinja",
  "generators/backend/shared/templates/*.jinja",
  "generators/backend/*/static/*.py",
  "generators/frontend/packs/builtin/*/pack.yaml",
  "generators/frontend/packs/builtin/*/templates/**/*.jinja",
  "generators/frontend/shared/templates/**/*.jinja",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "adrf>=0.1.14",
    "aiosqlite>=0.22.1",
    "django>=5.2.18",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
